[package]
name = "air-launcher"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "AirLauncher"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
